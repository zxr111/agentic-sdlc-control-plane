services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_sdlc_factory_test
      MYSQL_USER: factory
      MYSQL_PASSWORD: factory
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 30
