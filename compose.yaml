x-factory-environment: &factory-environment
  DATABASE_URL: postgres://factory:factory@postgres:5432/ai_sdlc_factory_test?sslmode=disable
  FACTORY_PROJECTS_FILE: /etc/factory/projects.json
  GITLAB_API_URL: ${GITLAB_API_URL:-https://git.kuainiujinke.com/api/v4}
  GITLAB_API_TOKEN: ${GITLAB_API_TOKEN:?GITLAB_API_TOKEN is required}
  GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:?GITLAB_WEBHOOK_SECRET is required}
  CALLBACK_SHARED_SECRET: ${CALLBACK_SHARED_SECRET:?CALLBACK_SHARED_SECRET is required}
  CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-https://kylith.atlassian.net}
  CONFLUENCE_EMAIL: ${CONFLUENCE_EMAIL:?CONFLUENCE_EMAIL is required}
  CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:?CONFLUENCE_API_TOKEN is required}
  OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
  DELIVERY_TRIGGER_URL: ${DELIVERY_TRIGGER_URL:-}
  DELIVERY_TRIGGER_TOKEN: ${DELIVERY_TRIGGER_TOKEN:-}
  V3_REGISTRY_ENABLED: ${V3_REGISTRY_ENABLED:-false}
  V3_CONTEXT_MANIFEST_ENABLED: ${V3_CONTEXT_MANIFEST_ENABLED:-false}
  V3_EVALUATION_ENABLED: ${V3_EVALUATION_ENABLED:-false}
  V3_RAG_ENABLED: ${V3_RAG_ENABLED:-false}
  V3_MEMORY_ENABLED: ${V3_MEMORY_ENABLED:-false}
  V3_MULTI_AGENT_ENABLED: ${V3_MULTI_AGENT_ENABLED:-false}
  V3_TOOL_GATEWAY_ENABLED: ${V3_TOOL_GATEWAY_ENABLED:-false}
  V3_MODEL_ROUTER_ENABLED: ${V3_MODEL_ROUTER_ENABLED:-false}

x-factory-service: &factory-service
  image: ai-sdlc-factory:local
  build:
    context: .
  environment: *factory-environment
  volumes:
    - ./deploy/overlays/test/projects.json:/etc/factory/projects.json:ro
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_sdlc_factory_test
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d ai_sdlc_factory_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: ai-sdlc-factory:local
    build:
      context: .
    command: ["/usr/local/bin/factory-migrate"]
    environment:
      DATABASE_URL: postgres://factory:factory@postgres:5432/ai_sdlc_factory_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *factory-service
    command: ["/usr/local/bin/factory-api"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *factory-service
    command: ["/usr/local/bin/factory-worker"]
    environment:
      <<: *factory-environment
      WORKER_ID: compose-worker
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
