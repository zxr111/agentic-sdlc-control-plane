apiVersion: batch/v1
kind: Job
metadata:
  name: ai-sdlc-factory-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sdlc-factory
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: ai-sdlc-factory
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ai-sdlc-factory:latest
          command: ["/usr/local/bin/factory-migrate"]
          envFrom:
            - secretRef:
                name: ai-sdlc-factory-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
