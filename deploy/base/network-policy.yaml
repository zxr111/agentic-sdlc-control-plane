apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-sdlc-factory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-factory
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argus-test
          podSelector:
            matchLabels:
              app: argus-hermes-api
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
