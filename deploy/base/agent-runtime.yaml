apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sdlc-factory-agent-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-factory
      app.kubernetes.io/component: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sdlc-factory
        app.kubernetes.io/component: agent-runtime
    spec:
      serviceAccountName: ai-sdlc-factory
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: ai-sdlc-factory:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/factory-worker"]
          env:
            - name: COMPONENT_MODE
              value: agent-runtime
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: AGENT_DATABASE_URL}}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: OPENAI_API_KEY}}
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_EVENT_TYPES
              value: workflow.analyze_requirement,workflow.generate_plans,workflow.generate_architecture
            - name: WORKER_OUTBOX_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: ai-sdlc-factory-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
