apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sdlc-factory-agent-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-factory
      app.kubernetes.io/component: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sdlc-factory
        app.kubernetes.io/component: agent-runtime
    spec:
      serviceAccountName: ai-sdlc-factory
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: ai-sdlc-factory:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/factory-agent-runtime"]
          env:
            - name: HTTP_ADDR
              value: :8090
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: OPENAI_API_KEY}}
            - name: AGENT_RUNTIME_SHARED_SECRET
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: AGENT_RUNTIME_SHARED_SECRET}}
          envFrom:
            - configMapRef:
                name: ai-sdlc-factory-config
          ports:
            - name: runtime-http
              containerPort: 8090
          readinessProbe:
            httpGet: {path: /healthz, port: runtime-http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: runtime-http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
