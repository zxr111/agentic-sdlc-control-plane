apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sdlc-factory-evaluation-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-factory
      app.kubernetes.io/component: evaluation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sdlc-factory
        app.kubernetes.io/component: evaluation-worker
    spec:
      serviceAccountName: ai-sdlc-factory
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evaluation-worker
          image: ai-sdlc-factory:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/factory-worker"]
          env:
            - name: COMPONENT_MODE
              value: evaluation-worker
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: EVALUATION_DATABASE_URL}}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: OPENAI_API_KEY}}
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_EVENT_TYPES
              value: evaluation.run
            - name: WORKER_OUTBOX_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: ai-sdlc-factory-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
