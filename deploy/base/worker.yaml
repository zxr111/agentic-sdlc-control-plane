apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sdlc-factory-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-factory
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sdlc-factory
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: ai-sdlc-factory
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ai-sdlc-factory:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/factory-worker"]
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: ai-sdlc-factory-config
            - secretRef:
                name: ai-sdlc-factory-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
