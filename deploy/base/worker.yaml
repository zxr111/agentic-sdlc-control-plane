apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sdlc-factory-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-factory
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sdlc-factory
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: ai-sdlc-factory
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ai-sdlc-factory:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/factory-worker"]
          env:
            - name: COMPONENT_MODE
              value: worker
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: DATABASE_URL}}
            - name: GITLAB_API_TOKEN
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: GITLAB_API_TOKEN}}
            - name: CONFLUENCE_EMAIL
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: CONFLUENCE_EMAIL}}
            - name: CONFLUENCE_API_TOKEN
              valueFrom: {secretKeyRef: {name: ai-sdlc-factory-secrets, key: CONFLUENCE_API_TOKEN}}
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_EVENT_TYPES
              value: gitlab.issue.changed,gitlab.gate.command,gitlab.control.command,gitlab.lifecycle,external.delivery,external.incident,system.reconcile
          envFrom:
            - configMapRef:
                name: ai-sdlc-factory-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
