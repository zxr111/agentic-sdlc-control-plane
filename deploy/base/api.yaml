apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sdlc-factory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-factory
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sdlc-factory
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: ai-sdlc-factory
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ai-sdlc-factory:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/factory-api"]
          envFrom:
            - configMapRef:
                name: ai-sdlc-factory-config
            - secretRef:
                name: ai-sdlc-factory-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
